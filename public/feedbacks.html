<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="logo.png" />
    <title>Feedbacks - EventSync</title>
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <div class="nav-container">
          <a href="index.html" class="nav-brand">
            <span class="brand-icon">⚡</span>
            <span class="brand-text">EventSync</span>
          </a>
          <div class="nav-actions">
            <a href="index.html" class="btn btn-outline">Home</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="container">
      <h1>User Feedbacks</h1>
      <section style="margin-top: var(--spacing-xl); text-align: center">
        <p
          style="
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-2xl);
          "
        >
          We're collecting feedback from our amazing users to continuously
          improve EventSync.
        </p>
        <p
          style="
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-lg);
          "
        >
          Thank you for being part of our community!
        </p>
        <a href="contact.html" class="button primary">Share Your Feedback</a>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-bottom">
        <p>&copy; 2025 EventSync. All rights reserved.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
