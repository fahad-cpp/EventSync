<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookings - EventSync Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <div class="nav-container">
        <a href="admin-dashboard.html" class="nav-brand">
          <span class="brand-icon">⚡</span>
          <span class="brand-text">EventSync Admin</span>
        </a>
        <div class="nav-links">
          <a href="admin-dashboard.html" class="nav-link">Dashboard</a>
          <a href="admin-venues.html" class="nav-link">Manage Venues</a>
          <a href="admin-bookings.html" class="nav-link active">Bookings</a>
          <a href="admin-users.html" class="nav-link">Users</a>
        </div>
        <div class="nav-actions">
          <button id="logoutBtn" class="btn btn-outline">Logout</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <h1>All Bookings</h1>
    <div class="booking-status-filter search-filter" style="margin: var(--spacing-lg) 0;">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="pending">Pending</button>
      <button class="filter-btn" data-status="confirmed">Confirmed</button>
      <button class="filter-btn" data-status="cancelled">Cancelled</button>
    </div>

    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>User</th>
            <th>Venue</th>
            <th>Event Date</th>
            <th>Event Type</th>
            <th>Guests</th>
            <th>Status</th>
            <th>Amount</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookingsTable">
          <tr><td colspan="9" style="text-align: center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>&copy; 2025 EventSync Admin. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
