<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - EventSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="logo.png" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <div class="nav-container">
          <a href="index.html" class="nav-brand">
            <span class="brand-icon">⚡</span>
            <span class="brand-text">EventSync</span>
          </a>
          <!-- Added nav-links and updated nav-actions -->
          <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About</a>
          </div>
          <div class="nav-actions">
            <!-- Populated by JS -->
          </div>
        </div>
      </nav>
    </header>

    <main class="container">
      <h1>Contact Us</h1>
      <form id="contactForm" class="form-card centered">
        <div class="form-group">
          <label for="contactName">Name</label>
          <input
            type="text"
            id="contactName"
            placeholder="Your name"
            required
          />
        </div>
        <div class="form-group">
          <label for="contactEmail">Email</label>
          <input
            type="email"
            id="contactEmail"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="contactMessage">Message</label>
          <textarea
            id="contactMessage"
            rows="6"
            placeholder="Your message..."
            required
          ></textarea>
        </div>
        <button type="submit" class="button primary" style="width: 100%">
          Send Message
        </button>
        <p id="contactMessageStatus" class="message"></p>
      </form>
    </main>

    <footer class="footer">
      <div class="footer-bottom">
        <p>&copy; 2025 EventSync. All rights reserved.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
