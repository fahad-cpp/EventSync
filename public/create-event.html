<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Event - EventSync</title>
    <link rel="icon" type="image/x-icon" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <div class="nav-container">
          <a href="dashboard.html" class="nav-brand">
            <span class="brand-icon">⚡</span>
            <span class="brand-text">EventSync</span>
          </a>
          <!-- Updated navbar to be consistent -->
          <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="create-event.html" class="nav-link active">Create Event</a>
            <a href="join-event.html" class="nav-link">Browse Events</a>
          </div>
          <div class="nav-actions">
            <!-- User icon button populated by JS -->
          </div>
        </div>
      </nav>
    </header>

    <main class="container">
      <h1>Create a New Event</h1>
      <form
        id="createEventForm"
        class="form-card"
        style="max-width: 600px; margin: 0 auto"
      >
        <div class="form-group">
          <label for="eventName">Event Name</label>
          <input
            type="text"
            id="eventName"
            placeholder="Enter event name"
            required
          />
        </div>
        <div class="form-group">
          <label for="eventDate">Date</label>
          <input type="date" id="eventDate" required />
        </div>
        <div class="form-group">
          <label for="eventTime">Time</label>
          <input type="time" id="eventTime" required />
        </div>
        <div class="form-group">
          <label for="eventLocation">Location</label>
          <input
            type="text"
            id="eventLocation"
            placeholder="Enter event location"
            required
          />
        </div>
        <div class="form-group">
          <label for="eventDescription">Description</label>
          <textarea
            id="eventDescription"
            rows="5"
            placeholder="Describe your event..."
          ></textarea>
        </div>
        <div class="form-group">
          <label>Event Type</label>
          <div class="toggle-switch">
            <input
              type="radio"
              id="public"
              name="eventType"
              value="Public"
              checked
            />
            <label for="public" class="switch-option">Public</label>
            <input type="radio" id="private" name="eventType" value="Private" />
            <label for="private" class="switch-option">Private</label>
          </div>
        </div>
        <button type="submit" class="button primary" style="width: 100%">
          Create Event
        </button>
        <p id="createEventMessage" class="message"></p>
      </form>
    </main>

    <footer class="footer">
      <div class="footer-bottom">
        <p>&copy; 2025 EventSync. All rights reserved.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
